name: Hotlists Refresh

# 双保险：
#   1) schedule 保底——每天北京时间 09:30 / 21:30 自动刷新一次，确保久未访问时热搜也不会太久没更新。
#   2) workflow_dispatch——Cloudflare Worker 在用户访问 /hot 且内容过期（>4h）时按需触发。
on:
  schedule:
    - cron: '30 1,13 * * *'   # UTC 01:30 / 13:30 = 北京时间 09:30 / 21:30
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tencent-news CLI
        run: |
          curl -fsSL https://mat1.gtimg.com/qqcdn/qqnews/cli/hub/tencent-news/setup.sh | sh
          export PATH="$HOME/.tencent-news-cli/bin:$HOME/.local/bin:$PATH"
        shell: bash

      - name: Configure API key
        run: |
          export PATH="$HOME/.tencent-news-cli/bin:$HOME/.local/bin:$PATH"
          # 积分不足/密钥异常时不中断抓榜（热搜榜仍能出，仅摘要反查跳过）
          tencent-news-cli apikey-set "${{ secrets.TN_API_KEY }}" || echo "WARN: API key 配置失败（可能积分不足），继续抓榜"

      - name: Fetch hotlists & generate hot.html
        env:
          # 全切 DS 时把 SUMMARIZE_DS 改为 1（需先在仓库 Secrets 配置 DEEPSEEK_API_KEY）
          SUMMARIZE_DS: '0'
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
        run: |
          export PATH="$HOME/.tencent-news-cli/bin:$HOME/.local/bin:$PATH"
          # 每班反查摘要（智能增量：只搜新词，老词复用仓库 hotlists.json 缓存，省积分）
          export ENRICH_SUMMARIES=1
          python3 fetch_hotlists.py
          python3 gen_hot.py hot.html
        working-directory: .

      - name: Write build marker
        run: |
          # Worker 据此判断热搜内容新鲜度
          python3 -c "import json,time; open('build-hot.json','w').write(json.dumps({'ts': int(time.time())}))"

      - name: Commit & push
        run: |
          git config user.name "ai-daily-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hot.html hotlists.json build-hot.json
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: refresh hotlists [skip ci]" || true
          # 并行 workflow 防竞态：先拉再推
          git pull --rebase origin main || true
          git push origin main

      - name: Notify failure
        if: failure()
        env:
          VAPID_JSON: ${{ secrets.VAPID_JSON }}
          SUBS_JSON: ${{ secrets.SUBS_JSON }}
          TITLE: '⚠️ 热搜刷新失败'
          BODY: '云端任务失败，请查看 GitHub Actions 日志'
        run: |
          npm install web-push --no-audit --no-fund >/dev/null 2>&1 || true
          NODE_PATH="$(pwd)/node_modules" node push.js || true
        shell: bash
