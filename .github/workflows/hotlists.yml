name: Hotlists Refresh

on:
  schedule:
    # 兜底：北京时间 09:00-01:00 每 2 小时 37 分（UTC 01,03,05,07,09,11,13,15,17 点 37 分）
    # 主触发靠 cron-job.org repository_dispatch（同节奏，需在 cron-job 同步配置）
    - cron: '37 1,3,5,7,9,11,13,15,17 * * *'
  repository_dispatch:
    types: [refresh]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Skip outside active window (09:00-01:00 every 2h, BJT)
        run: |
          # 活跃窗口（北京时间）：01,09,11,13,15,17,19,21,23 点
          H=$(TZ=Asia/Shanghai date +%H)
          case "$H" in
            01|09|11|13|15|17|19|21|23) echo "活跃时段 $H 点，继续";;
            *) echo "非活跃时段 $H 点，跳过本次"; exit 0;;
          esac
        shell: bash

      - name: Install tencent-news CLI
        run: |
          curl -fsSL https://mat1.gtimg.com/qqcdn/qqnews/cli/hub/tencent-news/setup.sh | sh
          export PATH="$HOME/.tencent-news-cli/bin:$HOME/.local/bin:$PATH"
        shell: bash

      - name: Configure API key
        run: |
          export PATH="$HOME/.tencent-news-cli/bin:$HOME/.local/bin:$PATH"
          # 积分不足/密钥异常时不中断抓榜（热搜榜仍能出，仅摘要反查跳过）
          tencent-news-cli apikey-set "${{ secrets.TN_API_KEY }}" || echo "WARN: API key 配置失败（可能积分不足），继续抓榜"

      - name: Fetch hotlists & generate hot.html
        run: |
          export PATH="$HOME/.tencent-news-cli/bin:$HOME/.local/bin:$PATH"
          # 摘要反查只在每天 09:00 档做（UTC 01 点，省积分），其余轮次只抓榜
          if [ "$(date -u +%H)" = "01" ]; then
            export ENRICH_SUMMARIES=1
            echo "本次运行将执行热词摘要反查（每天 09:00 档）"
          else
            echo "本次运行跳过摘要反查（省积分）"
          fi
          python3 fetch_hotlists.py
          python3 gen_hot.py hot.html
        working-directory: .

      - name: Commit & push
        run: |
          git config user.name "ai-daily-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hot.html
          if git diff --cached --quiet; then
            echo "hot.html 无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: refresh hotlists [skip ci]"
          git push origin main

      - name: Notify failure
        if: failure()
        env:
          VAPID_JSON: ${{ secrets.VAPID_JSON }}
          SUBS_JSON: ${{ secrets.SUBS_JSON }}
          TITLE: '⚠️ 热搜刷新失败'
          BODY: '云端任务失败，请查看 GitHub Actions 日志'
        run: |
          npm install web-push --no-audit --no-fund >/dev/null 2>&1 || true
          NODE_PATH="$(pwd)/node_modules" node push.js || true
        shell: bash
