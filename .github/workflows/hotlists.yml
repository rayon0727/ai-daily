name: Hotlists Refresh

on:
  schedule:
    # 兜底：北京时间每小时 37 分（GitHub schedule 偶发不触发，主触发靠 cron-job.org repository_dispatch）
    - cron: '37 * * * *'
  repository_dispatch:
    types: [refresh]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tencent-news CLI
        run: |
          curl -fsSL https://mat1.gtimg.com/qqcdn/qqnews/cli/hub/tencent-news/setup.sh | sh
          export PATH="$HOME/.tencent-news-cli/bin:$HOME/.local/bin:$PATH"
        shell: bash

      - name: Configure API key
        run: |
          export PATH="$HOME/.tencent-news-cli/bin:$HOME/.local/bin:$PATH"
          # 积分不足/密钥异常时不中断抓榜（热搜榜仍能出，仅摘要反查跳过）
          tencent-news-cli apikey-set "${{ secrets.TN_API_KEY }}" || echo "WARN: API key 配置失败（可能积分不足），继续抓榜"

      - name: Fetch hotlists & generate hot.html
        run: |
          export PATH="$HOME/.tencent-news-cli/bin:$HOME/.local/bin:$PATH"
          # 摘要反查只在北京时间 08:00 那次做（省积分），其余小时只抓榜
          if [ "$(date -u +%H)" = "00" ]; then
            export ENRICH_SUMMARIES=1
            echo "本次运行将执行热词摘要反查（北京时间 08:00 档）"
          else
            echo "本次运行跳过摘要反查（省积分）"
          fi
          python3 fetch_hotlists.py
          python3 gen_hot.py hot.html
        working-directory: .

      - name: Commit & push
        run: |
          git config user.name "ai-daily-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hot.html
          if git diff --cached --quiet; then
            echo "hot.html 无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: refresh hotlists [skip ci]"
          git push origin main

      - name: Notify failure
        if: failure()
        env:
          VAPID_JSON: ${{ secrets.VAPID_JSON }}
          SUBS_JSON: ${{ secrets.SUBS_JSON }}
          TITLE: '⚠️ 热搜刷新失败'
          BODY: '云端任务失败，请查看 GitHub Actions 日志'
        run: |
          npm install web-push --no-audit --no-fund >/dev/null 2>&1 || true
          NODE_PATH="$(pwd)/node_modules" node push.js || true
        shell: bash
