name: Hotlists Refresh

on:
  schedule:
    # 兜底：北京时间 08:00-24:00 每小时 37 分（UTC 00-16 点 37 分）
    # 主触发靠 cron-job.org repository_dispatch（同节奏，需在 cron-job 同步配置）
    - cron: '37 0-16 * * *'
  repository_dispatch:
    types: [refresh]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Skip outside active window (08:00-24:00 every hour, BJT)
        run: |
          # 活跃窗口（北京时间）：00,08-23 点（每小时一班）
          H=$(TZ=Asia/Shanghai date +%H)
          case "$H" in
            00|0[89]|1[0-9]|2[0-3]) echo "活跃时段 $H 点，继续";;
            *) echo "非活跃时段 $H 点，跳过本次"; exit 0;;
          esac
        shell: bash

      - name: Install tencent-news CLI
        run: |
          curl -fsSL https://mat1.gtimg.com/qqcdn/qqnews/cli/hub/tencent-news/setup.sh | sh
          export PATH="$HOME/.tencent-news-cli/bin:$HOME/.local/bin:$PATH"
        shell: bash

      - name: Configure API key
        run: |
          export PATH="$HOME/.tencent-news-cli/bin:$HOME/.local/bin:$PATH"
          # 积分不足/密钥异常时不中断抓榜（热搜榜仍能出，仅摘要反查跳过）
          tencent-news-cli apikey-set "${{ secrets.TN_API_KEY }}" || echo "WARN: API key 配置失败（可能积分不足），继续抓榜"

      - name: Fetch hotlists & generate hot.html
        run: |
          export PATH="$HOME/.tencent-news-cli/bin:$HOME/.local/bin:$PATH"
          # 每班反查摘要（智能增量：只搜新词，老词复用仓库 hotlists.json 缓存，省积分）
          export ENRICH_SUMMARIES=1
          python3 fetch_hotlists.py
          python3 gen_hot.py hot.html
        working-directory: .

      - name: Commit & push
        run: |
          git config user.name "ai-daily-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hot.html hotlists.json
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: refresh hotlists [skip ci]" || true
          # 并行 workflow 防竞态：先拉再推
          git pull --rebase origin main || true
          git push origin main

      - name: Notify failure
        if: failure()
        env:
          VAPID_JSON: ${{ secrets.VAPID_JSON }}
          SUBS_JSON: ${{ secrets.SUBS_JSON }}
          TITLE: '⚠️ 热搜刷新失败'
          BODY: '云端任务失败，请查看 GitHub Actions 日志'
        run: |
          npm install web-push --no-audit --no-fund >/dev/null 2>&1 || true
          NODE_PATH="$(pwd)/node_modules" node push.js || true
        shell: bash
